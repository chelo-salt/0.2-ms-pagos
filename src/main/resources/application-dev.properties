spring.application.name=pagos (DEV)

# Configuración de la Base de Datos MySQL corporativa
spring.datasource.url=jdbc:mysql://localhost:3307/db_pagos
spring.datasource.username=root
spring.datasource.password=system

# Estrategia de JPA: Dejamos en 'none' porque Flyway creará la tabla mediante scripts organizados
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del Microservicio de Pagos (Evita colisiones con Auth y Canchas)
server.port=8082

# Control de Versiones de Base de Datos con Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false