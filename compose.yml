services:
  mysql:
    image: 'mysql:latest'
    container_name: 'MS-pagos_bd'
    environment:
      - 'MYSQL_DATABASE=bd_pagos'
      - 'MYSQL_ROOT_PASSWORD=root'

    ports:
      - '3318:3306'

    volumes:
      - ./mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: MS_pagos_gui
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - '9018:80'
