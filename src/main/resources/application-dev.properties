# Nombre único de identificación en el ecosistema Spring Cloud
spring.application.name=ms-pagos

# Puerto nativo del Microservicio de Pagos (Sintonizado con el ms-gateway)
server.port=8082

# ── 🗄️ CONFIGURACIÓN DE PERSISTENCIA (MYSQL) ───────────────────────
# Conexión directa al contenedor Docker asignado a las finanzas
spring.datasource.url=jdbc:mysql://localhost:3307/db_pagos
spring.datasource.username=root
spring.datasource.password=system

# 🔄 CORREGIDO: Cambiado estrictamente a 'none'. 
# Esto evita que Hibernate altere las tablas en paralelo y sabotee el control de versiones de Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── 📬 CONTROL DE VERSIONES DE BASE DE DATOS (FLYWAY) ──────────────
spring.flyway.enabled=true
# ⚠️ NOTA: Asegúrate de que en tu carpeta 'resources' el directorio se llame 'db' y no 'dv' como en la foto.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false